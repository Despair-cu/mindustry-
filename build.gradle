plugins {
    id 'java'
}

repositories {
    // 优先本地 libs/ 目录（放 Mindustry.jar / MindustryX loader.jar 即可）
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    // 方式1（推荐）：把下载到的 Mindustry.jar（v159.7）或 MindustryX loader.jar 放进 libs/
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 方式2（备选，需网络）：com.github.Anuken:Mindustry:v159.7
    // implementation 'com.github.Anuken:Mindustry:v159.7'
}

jar {
    manifest {
        attributes 'Implementation-Title': 'RedTeamAI'
    }
    // 不打包依赖进 jar（Mindustry Mod 运行时由游戏提供类）
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
